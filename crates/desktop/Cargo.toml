[package]
name = "lan-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
lan-remote-core.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11"] }
enigo = { version = "0.6", default-features = false }
if-addrs = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = { version = "0.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "12", features = ["macos_14_0"] }
