[package]
name = "remoters-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "remoters-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
remoters-core.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres"] }
subtle = "2.6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
