name: macOS desktop (manual)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --release --workspace --locked
      - name: Build desktop app
        run: cargo build --release --locked -p remoters
      - name: Package app
        run: |
          bash packaging/macos.sh target/release/remoters dist/Remoters.app
          ditto -c -k --keepParent dist/Remoters.app dist/Remoters-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remoters-macos-arm64
          path: dist/Remoters-macOS.zip
          if-no-files-found: error
