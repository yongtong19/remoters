name: Desktop

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: lan-remote-macos-arm64
          - os: windows-latest
            artifact: lan-remote-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build desktop app
        run: cargo build --release --locked -p lan-remote
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos.sh target/release/lan-remote dist/LanRemote.app
          ditto -c -k --keepParent dist/LanRemote.app dist/LanRemote-macOS.zip
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/LanRemote-macOS.zip
          if-no-files-found: error
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/lan-remote.exe
          if-no-files-found: error
