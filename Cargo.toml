[workspace]
members = ["crates/core", "crates/desktop", "crates/server", "crates/android-ffi"]
exclude = ["vendor/gpui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
anyhow = "1.0"
remoters-core = { path = "crates/core" }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
